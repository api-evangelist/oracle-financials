naftiko: 1.0.0-alpha2
info:
  label: Oracle Financials General Ledger API
  description: REST API for Oracle Fusion Cloud Financials General Ledger, providing programmatic access to journal batches,
    journal entries, ledger balances, currency rates, chart of accounts filters, and budgetary control. The API supports creating,
    retrieving, updating, and deleting journal batches, viewing account balances for any account combination or account group,
    and managing currency conversion rates used across the financial system.
  tags:
  - Oracle
  - Financials
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
