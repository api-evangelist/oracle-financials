specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Oracle Financials
providerId: oracle-financials
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Accounting
  - ERP
  - Financial Management
  - Oracle Cloud
  - SaaS
description: >-
  Oracle Financials Cloud (part of Oracle Fusion Cloud ERP) is sold as a
  SaaS subscription via the Oracle Cloud Applications price list. Pricing is
  per Hosted Named User per month (with separate Hosted Employee or Hosted
  Single-Sign-On Employee user metrics for some modules) and is published on
  the Oracle Applications Global Price List PDF rather than as an interactive
  pricing page. There is no free, freemium, or per-API public tier; access to
  the REST APIs is included with any active Oracle Financials Cloud
  subscription. Engage Oracle Sales for the current per-user rate.
sources:
  - https://www.oracle.com/erp/financials/
  - https://docs.oracle.com/en/cloud/saas/financials/
  - https://www.oracle.com/applications/customer-experience/contact/
notes: >-
  Oracle blocks programmatic fetches of www.oracle.com pricing pages (HTTP 403).
  Plan structure preserved as a single SaaS subscription tier plus an
  enterprise agreement; replace per-user list price with the verified Oracle
  Applications Global Price List value when available.
plans:
  - id: oracle-financials-cloud-subscription
    name: Oracle Financials Cloud Subscription
    type: subscription
    description: >-
      SaaS subscription to Oracle Financials Cloud, billed monthly per Hosted
      Named User. Includes the Oracle Financials REST API surface (General
      Ledger, Accounts Payable, Accounts Receivable, Cash Management, Fixed
      Assets, Expense Management, Financial Reporting) at no additional
      per-call cost.
    entries:
      - label: Hosted Named User
        name: hosted_named_user
        type: subscription
        metric: user
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
      - label: Hosted Employee
        name: hosted_employee
        type: subscription
        metric: employee
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
      - label: REST API Calls (included)
        name: rest_api_calls
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Oracle Financials General Ledger API
      - name: Oracle Financials Accounts Payable API
      - name: Oracle Financials Accounts Receivable API
      - name: Oracle Financials Cash Management API
      - name: Oracle Financials Expense Management API
      - name: Oracle Financials Fixed Assets API
      - name: Oracle Financial Reporting API
  - id: oracle-financials-enterprise
    name: Enterprise Agreement
    type: enterprise
    description: >-
      Negotiated enterprise agreement covering Oracle Financials Cloud plus
      adjacent Fusion Cloud ERP modules (Procurement, Project Management,
      Risk Management). Includes contractual SLAs and named technical account
      management.
    entries:
      - label: Negotiated User Volume
        name: negotiated_users
        type: subscription
        metric: user
        limit: -1
        timeFrame: year
        geo: configurable
        unit: 1
        price: custom
        userMultiplied: true
    elements:
      - name: Oracle Financials General Ledger API
      - name: Oracle Financials Accounts Payable API
      - name: Oracle Financials Accounts Receivable API
      - name: Oracle Financials Cash Management API
      - name: Oracle Financials Expense Management API
      - name: Oracle Financials Fixed Assets API
      - name: Oracle Financial Reporting API
maintainers:
