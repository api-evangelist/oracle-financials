components:
  parameters:
    finder:
      name: finder
      in: query
      description: Named finder to execute a predefined query
      schema:
        type: string
    JeBatchId:
      name: JeBatchId
      in: path
      required: true
      description: Unique identifier for the journal batch
      schema:
        type: integer
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        default: 25
    offset:
      name: offset
      in: query
      description: Number of items to skip before returning results
      schema:
        type: integer
        default: 0
    expand:
      name: expand
      in: query
      description: Comma-separated list of child resources to expand in the response
      schema:
        type: string
    q:
      name: q
      in: query
      description: Filter expression using Oracle REST query syntax
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: Comma-separated list of fields to include in the response
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      description: Comma-separated list of fields to sort by, with optional asc or desc
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 500
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    Q:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Oracle filter expression.
  schemas:
    JournalBatch:
      type: object
      description: A journal batch containing one or more journal entries for posting to the general ledger
      properties:
        JeBatchId:
          type: integer
          description: Unique system-generated identifier for the journal batch
        Name:
          type: string
          description: Name of the journal batch
        Description:
          type: string
          description: Description of the journal batch
        Status:
          type: string
          description: Current status of the journal batch
        PostingStatus:
          type: string
          description: Posting status of the batch
        ApprovalStatus:
          type: string
          description: Approval status of the batch
        LedgerName:
          type: string
          description: Name of the ledger associated with this batch
        LedgerId:
          type: integer
          description: Unique identifier of the ledger
        AccountingPeriodName:
          type: string
          description: Name of the accounting period
        DefaultEffectiveDate:
          type: string
          format: date
          description: Default effective date for journals in this batch
        CreatedBy:
          type: string
          description: Username of the person who created the batch
        CreationDate:
          type: string
          format: date-time
          description: Timestamp when the batch was created
        LastUpdateDate:
          type: string
          format: date-time
          description: Timestamp when the batch was last modified
    JournalBatchUpdate:
      type: object
      description: Updatable fields for a journal batch, limited to completion status and reversal attributes
      properties:
        Status:
          type: string
          description: Updated status of the journal batch
        ReversalDate:
          type: string
          format: date
          description: Date for reversing the journal batch
        ReversalPeriodName:
          type: string
          description: Accounting period name for the reversal
    ResourceCollection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
        hasMore:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
    ErrorResponse:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        o:errorCode:
          type: string
    Link:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        name:
          type: string
        kind:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Oracle Identity Cloud Service
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with Oracle Cloud user credentials.
