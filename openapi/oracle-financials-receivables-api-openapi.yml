openapi: 3.2.0
info:
  title: Oracle Financials Cloud REST Receivables API
  description: REST API surface for Oracle Fusion Cloud Financials.
  version: 11.13.18.05
  contact:
    name: Oracle Support
    url: https://support.oracle.com
servers:
- url: https://{instance}.oraclecloud.com/fscmRestApi/resources/11.13.18.05
  description: Customer Fusion Cloud Financials base URL.
  variables:
    instance:
      default: example
      description: Customer-specific Oracle Cloud instance.
security:
- basicAuth: []
- bearerAuth: []
tags:
- name: Receivables
  description: Customer transactions.
paths:
  /receivablesCustomerTransactions:
    get:
      tags:
      - Receivables
      summary: List receivables customer transactions
      operationId: listReceivablesTransactions
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Customer transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollection'
components:
  schemas:
    Link:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        name:
          type: string
        kind:
          type: string
    ResourceCollection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
        hasMore:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 500
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with Oracle Cloud user credentials.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 Bearer token from Oracle IDCS / IAM.
externalDocs:
  description: Oracle Financials Cloud REST API Documentation
  url: https://docs.oracle.com/en/cloud/saas/financials/26a/farfa/index.html
