openapi: 3.2.0
info:
  title: Oracle Financials Ledger Balances API
  version: 11.13.18.05
  description: 'Operations tagged Ledger Balances across 2 of this provider''s published API definitions: oracle-financials-general-ledger-openapi.yml, oracle-general-ledger-ledger-balances-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{instance}.oraclecloud.com
  description: Oracle Fusion Cloud Instance
  variables:
    instance:
      default: servername
      description: Your Oracle Cloud instance identifier
- url: https://{instance}.oraclecloud.com/fscmRestApi/resources/11.13.18.05
  description: Customer Oracle Cloud instance.
  variables:
    instance:
      default: example
      description: Customer-specific Oracle Cloud instance.
tags:
- name: Ledger Balances
  description: View balance amounts for account combinations or accounts defined as part of an account group
paths:
  /fscmRestApi/resources/11.13.18.05/ledgerBalances:
    get:
      operationId: listLedgerBalances
      summary: Oracle Financials List account balances
      description: Retrieve balance amounts for account combinations or accounts defined as part of an account group. Supports filtering by ledger, period, account segment values, and balance type.
      tags:
      - Ledger Balances
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/orderBy'
      - $ref: '#/components/parameters/finder'
      responses:
        '200':
          description: Successful retrieval of ledger balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerBalance'
                  count:
                    type: integer
                    description: Number of items returned
                  hasMore:
                    type: boolean
                    description: Whether more items are available
        '401':
          description: Unauthorized - invalid or missing credentials
      security:
      - bearerAuth: []
    servers:
    - url: https://{instance}.oraclecloud.com
      description: Oracle Fusion Cloud Instance
      variables:
        instance:
          default: servername
          description: Your Oracle Cloud instance identifier
  /ledgerBalances:
    get:
      tags:
      - Ledger Balances
      summary: List ledger balances
      operationId: getLedgerBalances
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - name: finder
        in: query
        required: false
        schema:
          type: string
        description: 'Oracle finder name, e.g. `AccountBalanceByCombinationFinder` or

          `AccountGroupBalanceFinder`.

          '
      responses:
        '200':
          description: Ledger balances collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCollection'
      security:
      - basicAuth: []
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: listLedgerBalances
    servers:
    - url: https://{instance}.oraclecloud.com/fscmRestApi/resources/11.13.18.05
      description: Customer Oracle Cloud instance.
      variables:
        instance:
          default: example
          description: Customer-specific Oracle Cloud instance.
components:
  parameters:
    finder:
      name: finder
      in: query
      description: Named finder to execute a predefined query
      schema:
        type: string
    q:
      name: q
      in: query
      description: Filter expression using Oracle REST query syntax
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      description: Comma-separated list of fields to sort by, with optional asc or desc
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        default: 25
    offset:
      name: offset
      in: query
      description: Number of items to skip before returning results
      schema:
        type: integer
        default: 0
    fields:
      name: fields
      in: query
      description: Comma-separated list of fields to include in the response
      schema:
        type: string
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 500
  schemas:
    LedgerBalance:
      type: object
      description: Account balance for a specific account combination within a ledger and accounting period
      properties:
        LedgerId:
          type: integer
          description: Unique identifier of the ledger
        LedgerName:
          type: string
          description: Name of the ledger
        PeriodName:
          type: string
          description: Accounting period name
        CurrencyCode:
          type: string
          description: ISO 4217 currency code for the balance
          pattern: ^[A-Z]{3}$
        AccountCombination:
          type: string
          description: Account combination string
        BeginningBalance:
          type: number
          description: Beginning balance for the period
        PeriodActivity:
          type: number
          description: Net activity for the period
        EndingBalance:
          type: number
          description: Ending balance for the period
        AmountType:
          type: string
          description: Type of balance amount
        ActualFlag:
          type: string
          enum:
          - A
          - B
          - E
          description: Balance type indicator where A is actual, B is budget, and E is encumbrance
    Link:
      type: object
      properties:
        rel:
          type: string
        href:
          type: string
        name:
          type: string
        kind:
          type: string
    ResourceCollection:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        count:
          type: integer
        hasMore:
          type: boolean
        limit:
          type: integer
        offset:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained from Oracle Identity Cloud Service
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication with Oracle Cloud user credentials.
