description: >-
  FOCUS-aligned FinOps view for Oracle Financials Cloud: a SaaS subscription
  billed monthly per Hosted Named User / Hosted Employee. REST API access is
  bundled with the subscription and does not generate a separate metered
  charge. FinOps observation focuses on user-license utilization rather than
  per-call consumption.
sources:
  - https://www.oracle.com/erp/financials/
  - https://docs.oracle.com/en/cloud/saas/financials/
notes: >-
  No per-API meter exists. Track license seat utilization through the Fusion
  Applications usage reports and reconcile against the contractual seat count
  on the order document.
