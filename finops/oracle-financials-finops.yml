meters:
  - name: hosted_named_user_subscription
    description: Active Hosted Named User seats per month
    unit: seat-month
    aggregation: max
    dimensions:
      - module
      - business_unit
  - name: hosted_employee_subscription
    description: Hosted Employee seats per month for employee-priced modules
    unit: employee-month
    aggregation: max
    dimensions:
      - module
      - business_unit
  - name: rest_api_calls
    description: REST API calls (informational; bundled in the subscription)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - consumer
  - name: file_based_data_imports
    description: FBDI / BI Publisher bulk extracts (informational)
    unit: job
    aggregation: count
    dimensions:
      - module
principles:
  - name: Visibility
    description: >-
      Review Hosted Named User / Hosted Employee utilization through the
      Fusion Applications Security Console and Manage Users area; reconcile
      monthly against the contractual seat count.
  - name: Allocation
    description: >-
      Tag user records with the consuming business unit and cost center so
      seat cost can be allocated back to finance teams.
  - name: Optimization
    description: >-
      Reclaim inactive seats, consolidate duplicate user records, and use the
      lower-priced Hosted Employee or Hosted Single-Sign-On metrics for
      light-touch users where the module supports them.
  - name: Accountability
    description: >-
      Assign the Financials applications administrator and the FP&A finance
      partner joint accountability for seat growth and renewal scoping.
